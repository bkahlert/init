name: docs

on:
  push:
    branches: ['main']
    paths-ignore: ['**.md','**.svg']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: docs
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare recording dependencies
        run: docker pull bkahlert/libguestfs:2.0.2

      - name: Prepare site directory
        run: |
          rm -rf -- build/pages
          mkdir -p build/pages

      - name: ● REC
        id: recordr
        uses: bkahlert/recordr@v0.2.6
        env:
          RECORDRW_IMAGE: bkahlert/recordr:0.2.6
          RECORDRW_ARGS: -e LIBGUESTFSW_IMAGE=bkahlert/libguestfs:2.0.2
        with:
          build-dir: build/rec
          out-dir: build/pages
          columns: '140'
          rows: '54'

      - name: Upload ● REC artifacts
        uses: actions/upload-artifact@v7.0.2
        if: success() || failure()
        with:
          name: rec-artifacts
          if-no-files-found: ignore
          path: build/rec

      - name: Create site index
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<title>init.rc recordings</title>' \
            '<p><a href="help.svg">init.rc help</a></p>' \
            '<p><a href="guestfish.svg">init.rc guestfish</a></p>' \
            > build/pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/pages

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy recordings
        id: deployment
        uses: actions/deploy-pages@v5.0.1
