name: build

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    branches: ['main']
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare
        id: prep
        run: |
          {
            echo "test_dir=test"
            echo "test_reports_dir=build/bats-tmp/test-reports"
            echo "test_reports_format=junit"
          } >> "$GITHUB_OUTPUT"

      - name: Run tests
        uses: bkahlert/bats-wrapper@v0.2.2
        env:
          BATSW_IMAGE: bkahlert/bats-wrapper:0.2.2
          BATSW_ARGS: >-
            -e BATSW_IMAGE=bkahlert/bats-wrapper:0.2.2
            -e RECORDRW_IMAGE=bkahlert/recordr:0.2.6
            -e LIBGUESTFSW_IMAGE=bkahlert/libguestfs:2.0.2
        with:
          report-formatter: ${{ steps.prep.outputs.test_reports_format }}
          output: ${{ steps.prep.outputs.test_reports_dir }}
          tests: ${{ steps.prep.outputs.test_dir }}

      - name: Upload test reports
        uses: actions/upload-artifact@v7.0.2
        if: success() || failure()
        with:
          name: test-reports
          if-no-files-found: error
          path: ${{ steps.prep.outputs.test_reports_dir }}/*.xml

  release-draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Draft release
        uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          body_path: CHANGELOG.md
          files: init.rc
          token: ${{ secrets.GITHUB_TOKEN }}
